# XcodeGen spec — generates LoverApp.xcodeproj on the CI runner.
# Edit this file to add files, change capabilities, or adjust settings —
# never commit a .xcodeproj manually since you can't open one on Windows.
# Docs: https://github.com/yonaskolb/XcodeGen

name: LoverApp
options:
  bundleIdPrefix: app.lover
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: zh-Hant
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: '5.10'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
    CODE_SIGN_STYLE: Automatic

targets:
  # ───── Main app ─────
  LoverApp:
    type: application
    platform: iOS
    sources:
      - path: ios/LoverApp
        excludes:
          - "Resources/**/*.json"   # JSON files added explicitly below as resources
      - path: ios/LoverApp/Resources
        type: folder    # bundles the entire folder as a resource
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lover.LoverApp
        PRODUCT_NAME: Lover
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'   # iPhone only
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 錄製語音訊息畀對方
        INFOPLIST_KEY_NSCameraUsageDescription: 影相同對方分享
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 揀相片同對方分享
        INFOPLIST_KEY_CFBundleDisplayName: Lover
        INFOPLIST_KEY_CFBundleLocalizations: zh-Hant,en,ja
        INFOPLIST_KEY_UIAppFonts: KleeOne-SemiBold.ttf,ZenMaruGothic-Medium.ttf,DMMono-Medium.ttf
    entitlements:
      path: ios/LoverApp/LoverApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.lover.shared
        com.apple.developer.applesignin:
          - Default
        aps-environment: development

  # ───── Unit tests (logic) ─────
  LoverAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/LoverAppTests
    dependencies:
      - target: LoverApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lover.LoverAppTests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lover.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Lover

  # ───── UI tests (snapshot capture for Windows-only dev) ─────
  LoverAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ios/LoverAppUITests
    dependencies:
      - target: LoverApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lover.LoverAppUITests
        TEST_TARGET_NAME: LoverApp

schemes:
  LoverApp:
    build:
      targets:
        LoverApp: all
        LoverAppTests: [test]
        LoverAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LoverAppTests
        - LoverAppUITests
    archive:
      config: Release
