# XcodeGen spec — generates LoverApp.xcodeproj on the CI runner.
# Edit this file to add files, change capabilities, or adjust settings —
# never commit a .xcodeproj manually since you can't open one on Windows.
# Docs: https://github.com/yonaskolb/XcodeGen
#
# Note: codebase target name is "LoverApp" (internal) but the user-facing
# product is "Us" with bundle ID michel.kit.us. The two naming layers are
# kept separate to avoid renaming source folders.

name: LoverApp
options:
  bundleIdPrefix: michel.kit
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: zh-Hant
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: '5.10'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
    CODE_SIGN_STYLE: Automatic

targets:
  # ───── Main app ─────
  LoverApp:
    type: application
    platform: iOS
    sources:
      - path: ios/LoverApp
        excludes:
          - "Resources/**/*.json"   # JSON files added explicitly below as resources
      - path: ios/LoverApp/Resources
        type: folder    # bundles the entire folder as a resource
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: michel.kit.us
        PRODUCT_NAME: Us
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'   # iPhone only
        # Use the committed Info.plist instead of Xcode's auto-generation —
        # the auto-gen path is unreliable on Codemagic + Xcode 26 + XcodeGen.
        INFOPLIST_FILE: ios/LoverApp/Info.plist
        GENERATE_INFOPLIST_FILE: 'NO'
    entitlements:
      path: ios/LoverApp/LoverApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.michel.kit.us.shared
        com.apple.developer.applesignin:
          - Default
        aps-environment: development

  # ───── Unit tests (logic) ─────
  LoverAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/LoverAppTests
    dependencies:
      - target: LoverApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: michel.kit.us.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Us.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Us

  # ───── UI tests (snapshot capture for Windows-only dev) ─────
  LoverAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ios/LoverAppUITests
    dependencies:
      - target: LoverApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: michel.kit.us.uitests
        TEST_TARGET_NAME: LoverApp

schemes:
  LoverApp:
    build:
      targets:
        LoverApp: all
        LoverAppTests: [test]
        LoverAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LoverAppTests
        - LoverAppUITests
    archive:
      config: Release
