# XcodeGen spec — generates LoverApp.xcodeproj on the CI runner.
# Edit this file to add files, change capabilities, or adjust settings —
# never commit a .xcodeproj manually since you can't open one on Windows.
# Docs: https://github.com/yonaskolb/XcodeGen
#
# Note: codebase target name is "LoverApp" (internal) but the user-facing
# product is "Us" with bundle ID michel.kit.us. The two naming layers are
# kept separate to avoid renaming source folders.

name: LoverApp
options:
  bundleIdPrefix: michel.kit
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: zh-Hant
  groupSortPosition: top
  generateEmptyDirectories: true

# SwiftPM packages resolved by Xcode at build time.
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: '5.10'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    # ENABLE_USER_SCRIPT_SANDBOXING removed — Xcode 26's strict sandboxing
    # blocks XcodeGen's Info.plist generation script from writing the file.
    # Code signing settings (CODE_SIGN_STYLE, CODE_SIGN_IDENTITY,
    # PROVISIONING_PROFILE_SPECIFIER) are intentionally NOT set here.
    # `xcode-project use-profiles` (Codemagic CLI) writes these into the
    # generated .xcodeproj at build time using the downloaded distribution
    # profile + cert. Setting them in project.yml caused a conflict that
    # produced the misleading codesign error
    #   "code object is not signed at all / In subcomponent: embedded.mobileprovision"
    # even with the right profile attached.
    DEVELOPMENT_TEAM: C22JSRYW54
    # Xcode 26 splits the app executable into a stub + Us.debug.dylib for
    # faster iteration. simctl install incorrectly reports "Missing bundle ID"
    # when handed such a stub, even though the .app's Info.plist is valid.
    # Force a single full executable.
    ENABLE_DEBUG_DYLIB: 'NO'
    ENABLE_DEBUG_DYLIB_SUPPORT: 'NO'

targets:
  # ───── Main app ─────
  LoverApp:
    type: application
    platform: iOS
    sources:
      # Single sources entry — Kaomoji.json picked up as a normal Resource and
      # placed at the bundle root (Us.app/Kaomoji.json) which is the standard
      # iOS app layout. Previously had a `type: folder` reference for Resources/
      # which created a Us.app/Resources/ subdirectory inside the bundle —
      # non-standard layout that may have confused codesign.
      - path: ios/LoverApp
        excludes:
          - "Info.plist"            # generated by XcodeGen via the info: block below
          - "LoverApp.entitlements" # referenced via entitlements: block, NOT a resource
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: michel.kit.us
        PRODUCT_NAME: Us
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.3.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'   # iPhone only
    # XcodeGen-managed Info.plist — the canonical path. Properties below get
    # written into ios/LoverApp/Info.plist on each `xcodegen generate`, with
    # CFBundleIdentifier / CFBundleExecutable / version keys auto-included
    # using the proper $(VAR) references that Xcode is guaranteed to expand.
    info:
      path: ios/LoverApp/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleDisplayName: Us
        # MUST be kept in sync with `MARKETING_VERSION` in settings.base above.
        # When omitted, XcodeGen writes the default "1.0" — and that default
        # ends up in every TestFlight build no matter what we do at CI time
        # (xcodebuild prefers the literal value baked into the regenerated
        # Info.plist over our post-`xcodegen generate` plutil edits, because
        # the archive step regenerates from the xcodeproj's INFOPLIST_KEY_*
        # build settings — which XcodeGen sets from this `info.properties`
        # block, NOT from `settings.base.MARKETING_VERSION`).
        # That's why every previous build shipped as "1.0" regardless of
        # MARKETING_VERSION. Update this literal whenever you bump
        # MARKETING_VERSION.
        CFBundleShortVersionString: 1.3.0
        # Required by App Store / TestFlight ingest. Must match the
        # AppIcon.appiconset name in Assets.xcassets, otherwise upload
        # rejects with: "Missing Info.plist value. A value for the
        # Info.plist key 'CFBundleIconName' is missing in the bundle".
        CFBundleIconName: AppIcon
        CFBundleLocalizations:
          - zh-Hant
          - en
          - ja
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSCameraUsageDescription: 影相同對方分享
        NSMicrophoneUsageDescription: 錄製語音訊息畀對方
        NSPhotoLibraryUsageDescription: 揀相片同對方分享
        # Skips ASC's "App 加密文件" dialog on every upload. Currently `false`
        # because v0.2.x uses no encryption. When Phase 4 adds E2EE
        # (CryptoKit X25519 + AES-GCM = standard algorithms used the same way
        # as Apple OS), keep this `false` — that keeps us under the
        # exempt-standard-algorithms exemption. Only flip to `true` if we
        # ever ship proprietary or non-standard crypto.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: ios/LoverApp/LoverApp.entitlements
      properties:
        # Push Notifications (always production for App Store / TestFlight).
        aps-environment: production
        # Sign in with Apple — re-enabled in Phase 3a. The capability was also
        # re-enabled on the michel.kit.us bundle ID in Apple Developer portal,
        # so the auto-regenerated profile from `fetch-signing-files --create`
        # will grant this entitlement.
        com.apple.developer.applesignin:
          - Default

  # ───── Unit tests (logic) ─────
  LoverAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/LoverAppTests
    dependencies:
      - target: LoverApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: michel.kit.us.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Us.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Us
    info:
      path: ios/LoverAppTests/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: BNDL
        CFBundleShortVersionString: 1.0
        CFBundleVersion: 1
        CFBundleInfoDictionaryVersion: 6.0

  # ───── UI tests (snapshot capture for Windows-only dev) ─────
  LoverAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ios/LoverAppUITests
    dependencies:
      - target: LoverApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: michel.kit.us.uitests
        TEST_TARGET_NAME: LoverApp
    info:
      path: ios/LoverAppUITests/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: BNDL
        CFBundleShortVersionString: 1.0
        CFBundleVersion: 1
        CFBundleInfoDictionaryVersion: 6.0

schemes:
  LoverApp:
    build:
      targets:
        LoverApp: all
        LoverAppTests: [test]
        LoverAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LoverAppTests
        - LoverAppUITests
    archive:
      config: Release
