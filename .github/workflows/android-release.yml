name: Android → signed AAB (Play Store)

# Phase D release workflow — produces a signed Android App Bundle (.aab)
# ready for Google Play upload. Separate from android-build.yml (debug APK,
# sideloadable) so the two artefacts stay independent and we never confuse
# a debug build with something that could end up on Play.
#
# Trigger: push a tag matching `android-release-v*` (e.g. `android-release-v1.5.1`).
# Output: signed AAB attached to a GitHub Release.
#
# Required GitHub Actions secrets:
#   ANDROID_UPLOAD_KEYSTORE_B64       — base64 of upload.keystore
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD  — keystore password
#   ANDROID_UPLOAD_KEY_PASSWORD       — key (alias) password
# Key alias is hardcoded to `upload` (matches keytool -alias on generation).

on:
  push:
    tags:
      - 'android-release-v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      # Decode the base64 keystore secret into a real file. Place it under
      # android/app/ so the gradle -P injected.signing.store.file path is
      # short and unambiguous when bundleRelease runs from the android/
      # working directory.
      - name: Decode upload keystore
        run: |
          echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}" | base64 --decode > app/upload.keystore
          test -s app/upload.keystore || { echo "Keystore decode failed (empty file)"; exit 1; }

      # bundleRelease produces app/build/outputs/bundle/release/app-release.aab.
      # The injected signing props override the (absent) signingConfig in
      # build.gradle.kts at build time — no plaintext creds in the repo.
      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          # AGP resolves `signing.store.file` relative to the Gradle daemon
          # CWD (~/.gradle/daemon/...) when given a relative path, not the
          # project dir. Pass an absolute path so it always resolves.
          KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/upload.keystore"
          ./gradlew :app:bundleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=upload \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # Always shred the decoded keystore — even on workflow failure the
      # runner is ephemeral, but leaving secrets on disk is sloppy.
      - name: Shred decoded keystore
        if: always()
        run: rm -f app/upload.keystore

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lover-app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish AAB as GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-release-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Signed Android App Bundle built from `${{ github.sha }}`.

            Upload `app-release.aab` to Play Console
            → Internal testing → Create new release → Upload.

            Play App Signing will re-sign the AAB with the app signing key
            Google holds; our upload keystore is only used to authenticate
            the upload itself.
          files: android/app/build/outputs/bundle/release/*.aab
          prerelease: true
