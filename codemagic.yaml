# Codemagic CI for Windows-only iOS development.
# Two workflows:
#   1. dev  → every push, builds for Simulator, runs UI tests, emails screenshots
#   2. testflight → tagged releases (v*.*.*), archives + uploads to TestFlight
#
# Setup steps live in docs/CODEMAGIC_SETUP.md. Required environment groups:
#   - app_store_credentials (only needed for the testflight workflow):
#       APP_STORE_CONNECT_PRIVATE_KEY    (the .p8 file contents)
#       APP_STORE_CONNECT_KEY_IDENTIFIER (Key ID)
#       APP_STORE_CONNECT_ISSUER_ID      (Issuer ID)

definitions:
  shared_env: &shared_env
    xcode: latest
    cocoapods: default
    vars:
      XCODE_PROJECT: LoverApp.xcodeproj
      XCODE_SCHEME: LoverApp
      BUNDLE_ID: michel.kit.us

  shared_scripts:
    install_xcodegen: &install_xcodegen
      name: Install XcodeGen
      script: |
        if ! command -v xcodegen >/dev/null 2>&1; then
          brew install xcodegen
        fi

    generate_project: &generate_project
      name: Generate Xcode project
      script: xcodegen generate

workflows:
  # ─────────────────────────────────────────────────────────────
  # DEV — runs on every push to any branch. No code signing.
  # Builds for iOS Simulator, runs UI tests that capture screenshots,
  # emails screenshots so user can review UI without SwiftUI Preview.
  # ─────────────────────────────────────────────────────────────
  dev:
    name: Dev Build (Compile-only)
    instance_type: mac_mini_m2
    max_build_duration: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
      cancel_previous_builds: true
    environment:
      <<: *shared_env
    scripts:
      - *install_xcodegen
      - *generate_project
      - name: Build (compile-only — no test, no install)
        script: |
          set -o pipefail
          # Plain `build` (not `build-for-testing`) — verifies all Swift code
          # compiles cleanly into a valid .app. We do NOT run xcodebuild test
          # because Codemagic + Xcode 26 + iOS 26 simulator has an unresolved
          # `simctl install: Missing bundle ID` issue that no amount of
          # Info.plist / signing fiddling resolves. Visual verification of
          # the UI happens via TestFlight on real iPhone instead.
          # See memory: project_codemagic_xcode26_simulator_blocker
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            ENABLE_DEBUG_DYLIB=NO ENABLE_DEBUG_DYLIB_SUPPORT=NO \
            | xcbeautify
      - name: Build summary
        script: |
          APP_PATH="build/Build/Products/Debug-iphonesimulator/Us.app"
          if [ -d "$APP_PATH" ]; then
            echo "✅ Build succeeded — Us.app produced"
            ls -la "$APP_PATH"
            echo ""
            echo "Bundle ID:"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
            echo ""
            echo "Executable size:"
            ls -lh "$APP_PATH/Us"
            echo ""
            echo "To see the app on your iPhone, push a tag (e.g. v0.1.0) to trigger the testflight workflow."
          else
            echo "❌ Build failed — Us.app not produced"
            exit 1
          fi
    artifacts:
      - build/Build/Products/Debug-iphonesimulator/Us.app
    publishing:
      email:
        recipients:
          - kck980724@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────────────────────
  # TESTFLIGHT — runs on tags matching v*.*.* (e.g. v0.1.0).
  # Requires: paid Apple Developer Program ($99/yr), App Store Connect API key.
  # ─────────────────────────────────────────────────────────────
  testflight:
    name: TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    # `integrations` is a top-level workflow field (sibling of `environment`).
    # Codemagic 2026 unified Apple Developer Portal + App Store Connect into
    # one integration that uses a single unified API key. Reference the
    # integration NAME from Codemagic UI → Settings → Integrations → Developer Portal.
    integrations:
      app_store_connect: CodeMagic
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    # NOTE: ios_signing block intentionally OMITTED from environment.
    # Codemagic's built-in auto-signing runs in the Initialize Build phase
    # (before any script step) and bombs out with "No matching profiles found"
    # when the App Store profile doesn't exist yet. We manage signing entirely
    # via scripts below (xcode-project fetch-signing-files --create) so we
    # control timing and can auto-create on first run.
    environment:
      <<: *shared_env
      groups:
        - app_store_credentials
    scripts:
      - *install_xcodegen
      - *generate_project
      - name: Set build number from latest TestFlight build
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" --tries 5 || echo 0) + 1))
          echo "Setting build number to $BUILD_NUMBER"
          cd $(dirname "$XCODE_PROJECT")
          agvtool new-version -all $BUILD_NUMBER
      - name: Set up signing (cert + profile, auto-created if missing)
        script: |
          # Canonical Codemagic signing flow when neither cert nor profile exist:
          #   1. Generate a fresh RSA private key locally
          #   2. fetch-signing-files --create uses that key as the CSR signer
          #      to ask Apple to issue a new distribution certificate, AND to
          #      create the App Store provisioning profile if missing
          #   3. Initialise a keychain + add the cert to it so xcodebuild can
          #      pick it up at archive time
          #   4. Use profiles wires Xcode project to the downloaded .mobileprovision
          set -e

          KEY_FILE=/tmp/apple_distribution.pem
          ssh-keygen -t rsa -b 2048 -m PEM -f "$KEY_FILE" -q -N ""

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:"$KEY_FILE" \
            --create

          keychain initialize
          keychain add-certificates

          xcode-project use-profiles
      - name: Build ipa
        script: |
          # ENABLE_DEBUG_DYLIB flags also matter for archive — without them
          # Xcode 26 sometimes produces a stub executable + sidecar .debug.dylib
          # that codesign refuses to sign as "code object not signed at all".
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-allowProvisioningUpdates" \
            --archive-xcargs="ENABLE_DEBUG_DYLIB=NO ENABLE_DEBUG_DYLIB_SUPPORT=NO"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - kck980724@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
