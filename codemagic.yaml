# Codemagic CI for Windows-only iOS development.
# Two workflows:
#   1. dev  → every push, builds for Simulator, runs UI tests, emails screenshots
#   2. testflight → tagged releases (v*.*.*), archives + uploads to TestFlight
#
# Setup steps live in docs/CODEMAGIC_SETUP.md. Required environment groups:
#   - app_store_credentials (only needed for the testflight workflow):
#       APP_STORE_CONNECT_PRIVATE_KEY    (the .p8 file contents)
#       APP_STORE_CONNECT_KEY_IDENTIFIER (Key ID)
#       APP_STORE_CONNECT_ISSUER_ID      (Issuer ID)
#       CERTIFICATE_PRIVATE_KEY          (the cert_private_key.pem contents —
#                                         same value as construction-app uses
#                                         since they share the distribution cert)

definitions:
  shared_env: &shared_env
    xcode: latest
    cocoapods: default
    vars:
      XCODE_PROJECT: LoverApp.xcodeproj
      XCODE_SCHEME: LoverApp
      BUNDLE_ID: michel.kit.us

  shared_scripts:
    install_xcodegen: &install_xcodegen
      name: Install XcodeGen
      script: |
        if ! command -v xcodegen >/dev/null 2>&1; then
          brew install xcodegen
        fi

    generate_project: &generate_project
      name: Generate Xcode project
      script: xcodegen generate

workflows:
  # ─────────────────────────────────────────────────────────────
  # DEV — runs on every push to any branch. No code signing.
  # Builds for iOS Simulator, runs UI tests that capture screenshots,
  # emails screenshots so user can review UI without SwiftUI Preview.
  # ─────────────────────────────────────────────────────────────
  dev:
    name: Dev Build (Compile-only)
    instance_type: mac_mini_m2
    max_build_duration: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
      cancel_previous_builds: true
    environment:
      <<: *shared_env
    scripts:
      - *install_xcodegen
      - *generate_project
      - name: Build (compile-only — no test, no install)
        script: |
          set -o pipefail
          # Plain `build` (not `build-for-testing`) — verifies all Swift code
          # compiles cleanly into a valid .app. We do NOT run xcodebuild test
          # because Codemagic + Xcode 26 + iOS 26 simulator has an unresolved
          # `simctl install: Missing bundle ID` issue that no amount of
          # Info.plist / signing fiddling resolves. Visual verification of
          # the UI happens via TestFlight on real iPhone instead.
          # See memory: project_codemagic_xcode26_simulator_blocker
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            ENABLE_DEBUG_DYLIB=NO ENABLE_DEBUG_DYLIB_SUPPORT=NO \
            | xcbeautify
      - name: Build summary
        script: |
          APP_PATH="build/Build/Products/Debug-iphonesimulator/Us.app"
          if [ -d "$APP_PATH" ]; then
            echo "✅ Build succeeded — Us.app produced"
            ls -la "$APP_PATH"
            echo ""
            echo "Bundle ID:"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
            echo ""
            echo "Executable size:"
            ls -lh "$APP_PATH/Us"
            echo ""
            echo "To see the app on your iPhone, push a tag (e.g. v0.1.0) to trigger the testflight workflow."
          else
            echo "❌ Build failed — Us.app not produced"
            exit 1
          fi
    artifacts:
      - build/Build/Products/Debug-iphonesimulator/Us.app
    publishing:
      email:
        recipients:
          - kck980724@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────────────────────
  # TESTFLIGHT — runs on tags matching v*.*.* (e.g. v0.1.0).
  # Requires: paid Apple Developer Program ($99/yr), App Store Connect API key.
  # ─────────────────────────────────────────────────────────────
  testflight:
    name: TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Mirrors the proven construction-app workflow:
    #   - NO integrations: block (CERTIFICATE_PRIVATE_KEY env var supplies key)
    #   - NO ios_signing: block (init phase has no signing to fail on)
    #   - --certificate-key @env: passes the .pem to fetch-signing-files
    #     so it can save+download the existing distribution cert
    #   - Manual archive + export with raw xcodebuild (matches construction-app)
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      <<: *shared_env
      groups:
        - app_store_credentials
      # NOTE: re-declare ALL vars here — YAML's `<<` merge does NOT recursively
      # merge nested maps. If we only set TEAM_ID, the shared XCODE_PROJECT /
      # XCODE_SCHEME / BUNDLE_ID get wiped, leading to:
      #   xcodebuild: error: '' is not a project file.
      vars:
        XCODE_PROJECT: LoverApp.xcodeproj
        XCODE_SCHEME: LoverApp
        BUNDLE_ID: michel.kit.us
        TEAM_ID: C22JSRYW54
    scripts:
      - *install_xcodegen
      - *generate_project
      - name: Set build + marketing version
        script: |
          # CFBundleVersion (build number) — unix timestamp so it's always
          # strictly higher than any prior upload, no API call needed. The old
          # approach used `app-store-connect get-latest-testflight-build-number
          # ... --tries 5` but the --tries flag was removed in newer
          # codemagic-cli-tools, so the command failed silently and
          # BUILD_NUMBER defaulted to 1, colliding with build 1 already in TF.
          BUILD_NUMBER=$(date +%s)
          echo "Setting build number to $BUILD_NUMBER"
          agvtool new-version -all $BUILD_NUMBER

          # CFBundleShortVersionString (marketing version) — read straight
          # from project.yml so it can never drift from the source of truth.
          # Without this, XcodeGen regenerates Info.plist with default "1.0"
          # on every build and `agvtool new-version` doesn't touch the short
          # version string — so every TestFlight build shipped as 1.0
          # regardless of MARKETING_VERSION in project.yml. The "v0.3" the
          # user kept seeing in TestFlight was actually a stale Swift hardcode
          # masking the same root issue.
          MARKETING_VERSION=$(grep "MARKETING_VERSION:" project.yml | head -1 | sed 's/.*MARKETING_VERSION: *//' | tr -d '[:space:]')
          if [ -z "$MARKETING_VERSION" ]; then
            echo "ERROR: could not parse MARKETING_VERSION from project.yml"
            exit 1
          fi
          echo "Setting marketing version to $MARKETING_VERSION"
          # Use plutil rather than `agvtool new-marketing-version` because
          # agvtool requires VERSIONING_SYSTEM = apple-generic which our
          # project doesn't set. plutil edits Info.plist directly and is
          # idempotent.
          plutil -replace CFBundleShortVersionString -string "$MARKETING_VERSION" ios/LoverApp/Info.plist
          # Sanity check: print the updated values so they show in CI logs.
          plutil -p ios/LoverApp/Info.plist | grep -E "CFBundleShortVersionString|CFBundleVersion"
      - name: Fetch App Store signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY"
          keychain add-certificates
          # Codemagic's `xcode-project use-profiles` uses the Ruby Xcodeproj
          # gem to write CODE_SIGN_IDENTITY / PROVISIONING_PROFILE_SPECIFIER
          # into the .xcodeproj. Older Xcodeproj versions don't understand
          # the Xcode 16/26 project format, so they silently fail to write
          # signing settings — leading to:
          #   "code object is not signed at all
          #    In subcomponent: .../Us.app/embedded.mobileprovision"
          # Force-update the gem before running use-profiles.
          # Ref: https://github.com/orgs/codemagic-ci-cd/discussions/2787
          gem update xcodeproj --no-document
          xcode-project use-profiles
      - name: Archive app
        script: |
          # Mirror construction-app's working pattern: raw `xcodebuild archive`
          # with NO CLI signing overrides. Let the per-target signing config
          # that `xcode-project use-profiles` wrote into the .xcodeproj drive
          # everything. The previous `xcode-project build-ipa` wrapper added
          # `'CODE_SIGN_IDENTITY=Apple Distribution' CODE_SIGN_STYLE=Manual`
          # as CLI overrides — those conflicted with use-profiles' per-target
          # PROVISIONING_PROFILE_SPECIFIER and produced the misleading
          # codesign error: "code object is not signed at all
          #   In subcomponent: .../Us.app/embedded.mobileprovision".
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath /tmp/Us.xcarchive \
            archive \
            -destination "generic/platform=iOS" \
            COMPILER_INDEX_STORE_ENABLE=NO
      - name: Export IPA
        script: |
          # Read the profile UUID embedded in the freshly-archived app, then
          # build an ExportOptions.plist that names it explicitly. Same as
          # construction-app — works reliably without re-signing surprises.
          PROFILE_UUID=$(security cms -D -i /tmp/Us.xcarchive/Products/Applications/Us.app/embedded.mobileprovision | plutil -extract UUID raw -)
          echo "Exporting with profile UUID: $PROFILE_UUID"
          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_UUID</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF
          mkdir -p build/ios/ipa
          xcodebuild \
            -exportArchive \
            -archivePath /tmp/Us.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - kck980724@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
