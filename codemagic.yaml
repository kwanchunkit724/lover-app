# Codemagic CI for Windows-only iOS development.
# Two workflows:
#   1. dev  → every push, builds for Simulator, runs UI tests, emails screenshots
#   2. testflight → tagged releases (v*.*.*), archives + uploads to TestFlight
#
# Setup steps live in docs/CODEMAGIC_SETUP.md. Required environment groups:
#   - app_store_credentials (only needed for the testflight workflow):
#       APP_STORE_CONNECT_PRIVATE_KEY    (the .p8 file contents)
#       APP_STORE_CONNECT_KEY_IDENTIFIER (Key ID)
#       APP_STORE_CONNECT_ISSUER_ID      (Issuer ID)

definitions:
  shared_env: &shared_env
    xcode: latest
    cocoapods: default
    vars:
      XCODE_PROJECT: LoverApp.xcodeproj
      XCODE_SCHEME: LoverApp
      BUNDLE_ID: michel.kit.us

  shared_scripts:
    install_xcodegen: &install_xcodegen
      name: Install XcodeGen
      script: |
        if ! command -v xcodegen >/dev/null 2>&1; then
          brew install xcodegen
        fi

    generate_project: &generate_project
      name: Generate Xcode project
      script: xcodegen generate

workflows:
  # ─────────────────────────────────────────────────────────────
  # DEV — runs on every push to any branch. No code signing.
  # Builds for iOS Simulator, runs UI tests that capture screenshots,
  # emails screenshots so user can review UI without SwiftUI Preview.
  # ─────────────────────────────────────────────────────────────
  dev:
    name: Dev Build (Simulator + Screenshots)
    instance_type: mac_mini_m2
    max_build_duration: 30
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
      cancel_previous_builds: true
    environment:
      <<: *shared_env
    scripts:
      - *install_xcodegen
      - *generate_project
      - name: Show project files (debug)
        script: |
          ls -la
          ls -la ios/LoverApp || true
      - name: Build for Simulator
        script: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=latest" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
      - name: ASSERT bundle ID exists in Us.app
        script: |
          set +e
          APP_PATH="build/Build/Products/Debug-iphonesimulator/Us.app"
          INFO="$APP_PATH/Info.plist"

          echo "============================================================"
          echo "== 1. Find ALL Info.plist files anywhere under build/"
          echo "============================================================"
          find build -name Info.plist -type f -ls 2>/dev/null

          echo ""
          echo "============================================================"
          echo "== 2. Contents of Us.app (top-level)"
          echo "============================================================"
          ls -la "$APP_PATH" 2>&1 | head -40

          echo ""
          echo "============================================================"
          echo "== 3. file(1) on Info.plist — binary / xml / missing?"
          echo "============================================================"
          file "$INFO" 2>&1
          ls -la "$INFO" 2>&1

          echo ""
          echo "============================================================"
          echo "== 4. plutil dump"
          echo "============================================================"
          plutil -p "$INFO" 2>&1

          echo ""
          echo "============================================================"
          echo "== 5. Raw bytes (hex head — first 200 bytes)"
          echo "============================================================"
          xxd "$INFO" 2>&1 | head -15

          echo ""
          echo "============================================================"
          echo "== 6. PlistBuddy CFBundleIdentifier read"
          echo "============================================================"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO" 2>&1
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO" 2>/dev/null)
          echo "Captured bundle ID: '$BUNDLE_ID'"

          echo ""
          echo "============================================================"
          echo "== 7. Source Info.plist generated by XcodeGen (in repo)"
          echo "============================================================"
          file ios/LoverApp/Info.plist 2>&1
          plutil -p ios/LoverApp/Info.plist 2>&1

          # Hard fail if bundle ID is empty — surfaces the problem in build status,
          # not buried in a later step.
          if [ -z "$BUNDLE_ID" ]; then
            echo ""
            echo "❌ FATAL: CFBundleIdentifier is empty/missing in Us.app/Info.plist"
            echo "   See sections above for diagnostic info."
            exit 1
          fi
          echo ""
          echo "✅ Bundle ID present: $BUNDLE_ID"
      - name: Run unit + UI tests (captures screenshots)
        script: |
          set +e
          APP_PATH="build/Build/Products/Debug-iphonesimulator/Us.app"
          INFO="$APP_PATH/Info.plist"

          echo "============================================================"
          echo "== PRE-TEST DIAGNOSTIC ($(date))"
          echo "============================================================"
          echo "-- Us.app top-level contents:"
          ls -la "$APP_PATH" 2>&1 | head -30
          echo ""
          echo "-- Info.plist file metadata:"
          file "$INFO" 2>&1
          ls -la "$INFO" 2>&1
          echo ""
          echo "-- Info.plist content via plutil:"
          plutil -p "$INFO" 2>&1
          echo ""
          echo "-- CFBundleIdentifier directly:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO" 2>&1
          echo ""
          echo "-- Try simctl install directly (clearer error than xcodebuild test):"
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 17 Pro" | head -1 | grep -oE "\([A-F0-9-]+\)" | tr -d '()')
          echo "Booting device $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>&1 || true
          xcrun simctl install "$DEVICE_ID" "$APP_PATH" 2>&1
          INSTALL_RC=$?
          echo "simctl install exit code: $INSTALL_RC"
          echo "============================================================"

          # Continue to xcodebuild test even if simctl had issues — keep both error paths visible.
          set -o pipefail
          xcodebuild test-without-building \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=latest" \
            -derivedDataPath build \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
      - name: Extract screenshots from xcresult
        script: |
          mkdir -p screenshots
          # xcparse extracts attachments (incl. our snapshot PNGs) from the .xcresult bundle.
          npm install -g xcparse 2>/dev/null || true
          if command -v xcparse >/dev/null 2>&1; then
            xcparse screenshots build/TestResults.xcresult screenshots --test
          fi
          # Fallback: walk the xcresult manually if xcparse is unavailable.
          if [ -z "$(ls -A screenshots 2>/dev/null)" ]; then
            find build/TestResults.xcresult -name "*.png" -exec cp {} screenshots/ \;
          fi
          ls -la screenshots
    artifacts:
      - screenshots/*.png
      - build/TestResults.xcresult
      - build/Build/Products/Debug-iphonesimulator/Us.app
    publishing:
      email:
        recipients:
          - kck980724@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────────────────────
  # TESTFLIGHT — runs on tags matching v*.*.* (e.g. v0.1.0).
  # Requires: paid Apple Developer Program ($99/yr), App Store Connect API key.
  # ─────────────────────────────────────────────────────────────
  testflight:
    name: TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    # `integrations` is a top-level workflow field (sibling of `environment`).
    # Codemagic 2026 unified Apple Developer Portal + App Store Connect into
    # one integration that uses a single unified API key. Reference the
    # integration NAME from Codemagic UI → Settings → Integrations → Developer Portal.
    integrations:
      app_store_connect: CodeMagic
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      <<: *shared_env
      groups:
        - app_store_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: michel.kit.us
    scripts:
      - *install_xcodegen
      - *generate_project
      - name: Set build number from latest TestFlight build
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" --tries 5 || echo 0) + 1))
          echo "Setting build number to $BUILD_NUMBER"
          cd $(dirname "$XCODE_PROJECT")
          agvtool new-version -all $BUILD_NUMBER
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-allowProvisioningUpdates"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - kck980724@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
